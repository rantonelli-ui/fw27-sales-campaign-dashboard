<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FW27 Item Details</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1e9}iframe{display:block;border:0;width:100%;height:100vh;background:#f4f1e9}</style></head><body><iframe id="dash" title="FW27 Item Details"></iframe><script>fetch('data/dashboard-data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw new Error('dashboard-data.json not found');return r.json()}).then(d=>{document.getElementById('dash').srcdoc=d.pages['items']}).catch(e=>{document.body.innerHTML='<div style="font:16px Segoe UI;padding:30px">Data error: '+e.message+'</div>'});</script></body></html>
